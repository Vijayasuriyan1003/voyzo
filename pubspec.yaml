name: voyzo
description: "Voyzo — Driver Transportation Management App."
publish_to: 'none'

version: 1.0.0+1

flutter_launcher_icons:
  android: true
  image_path: "assets/images/icon.jpg"
  min_sdk_android: 21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Code generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI utilities
  flutter_screenutil: ^5.9.3

  # Date formatting
  intl: ^0.19.0
  dropdown_button2: ^3.1.0


  # launch website
  url_launcher: ^6.3.0
  internet_connection_checker_plus: ^3.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5


  # Manage Cookie
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  flutter_native_splash: ^2.4.8

  # image selector
  image_picker: ^1.1.2
  image_cropper: ^9.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/voyzo_logo_android12.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

  android: true
  ios: false
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/voyzo_logo_android12.png
    icon_background_color: "#FE8A08" 